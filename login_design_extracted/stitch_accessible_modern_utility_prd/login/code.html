<style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        h1, h2, h3, h4, h5, h6, .font-headline {

        }

<body class="antialiased min-h-screen flex flex-col items-center justify-center pt-20 px-4 md:px-8 bg-surface">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-[#F9F9F7]/80 dark:bg-[#1A1C1B]/80 backdrop-blur-md flex items-center justify-between px-8 h-20 w-full surface-container-low">
<button aria-label="Go back" class="flex items-center justify-center w-12 h-12 hover:bg-[#F4F4F2] dark:hover:bg-[#2A2C2B] rounded-full transition-colors active:scale-95 transition-transform duration-200 ease-out text-[#1A1C1B]/60 dark:text-[#F9F9F7]/60">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Clash_Display'] font-bold tracking-tight text-[#A63B00] dark:text-[#FF5E00] text-xl absolute left-1/2 -translate-x-1/2">FUEL TRACKER</h1>
<div class="w-12 h-12"></div> <!-- Spacer for flex-between balance -->
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md mx-auto flex flex-col gap-8 relative z-10 py-12">
<!-- Welcome Header -->
<div class="text-center space-y-4 mb-4">
<div class="w-20 h-20 bg-surface-container-high rounded-full mx-auto flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="local_gas_station" style="font-variation-settings: 'FILL' 1;">local_gas_station</span>
</div>
<h2 class="font-headline font-bold text-3xl tracking-tight text-on-surface">Welcome Back</h2>
<p class="font-body text-base text-on-surface-variant">Sign in to track your fuel efficiency and expenses.</p>
</div>
<!-- Login Form -->
<form class="space-y-6 w-full">
<div class="space-y-5 p-6 bg-surface-container-lowest shadow-[0px_24px_48px_rgba(26,28,27,0.06)] relative z-20 rounded-2xl">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label text-sm font-semibold text-on-surface uppercase tracking-wide" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="mail">mail</span>
</span>
<input class="w-full bg-surface-container-low border-0 text-on-surface placeholder-on-surface-variant/50 rounded-DEFAULT py-4 pl-12 pr-4 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors font-body" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label text-sm font-semibold text-on-surface uppercase tracking-wide" for="password">Password</label>
<a class="font-body text-sm font-medium text-primary hover:text-primary-container transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="lock">lock</span>
</span>
<input class="w-full bg-surface-container-low border-0 text-on-surface placeholder-on-surface-variant/50 rounded-DEFAULT py-4 pl-12 pr-4 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors font-body" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-4 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full py-4 mt-2 bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 rounded-2xl" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Alternative Actions -->
<div class="space-y-4 pt-4">
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-surface-container-high"></div>
<span class="flex-shrink-0 mx-4 text-on-surface-variant font-label text-xs uppercase tracking-wider">Or continue with</span>
<div class="flex-grow border-t border-surface-container-high"></div>
</div>
<div class="grid grid-cols-1 gap-3">
<button class="w-full py-4 bg-surface-container-high text-on-surface font-body font-semibold rounded-DEFAULT hover:bg-surface-variant transition-colors flex items-center justify-center gap-3" type="button">
<span class="material-symbols-outlined" data-icon="key">key</span>
                        Login with Auth Key
                    </button>
<button class="w-full py-4 bg-surface-container-lowest border border-outline-variant/30 text-on-surface font-body font-semibold rounded-DEFAULT hover:bg-surface-container-low transition-colors flex items-center justify-center gap-3 shadow-sm" type="button">
<!-- Simplified Google Icon Placeholder -->
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Continue with Google
                    </button><button class="w-full py-4 bg-surface-container-lowest border border-outline-variant/30 text-on-surface font-body font-semibold rounded-DEFAULT hover:bg-surface-container-low transition-colors flex items-center justify-center gap-3 shadow-sm" type="button">
<svg class="w-5 h-5" fill="#1877F2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
  Continue with Facebook
</button>
</div>
</div>
<!-- Footer Link -->
<div class="text-center pt-6">
<p class="font-body text-on-surface-variant">Don't have an account? 
                    <a class="font-bold text-primary hover:text-primary-container transition-colors relative after:content-[''] after:absolute after:-bottom-1 after:left-0 after:w-full after:h-[2px] after:bg-primary-container after:scale-x-0 hover:after:scale-x-100 after:transition-transform after:origin-left" href="#">Create an account</a>
</p>
</div>
</form>
