<!-- Top Navigation (Transactional, minimal) -->
<nav class="fixed top-0 w-full z-50 flex items-center justify-between px-6 h-16 w-full max-w-7xl mx-auto bg-surface/80 backdrop-blur-md">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-low text-on-surface hover:bg-surface-container-high transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<span class="font-display font-bold text-xl text-on-surface tracking-tight">Security</span>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</nav>
<!-- Main Content Canvas -->
<main class="w-full max-w-md mx-auto mt-16 flex-grow flex flex-col justify-center">
<!-- Header Section -->
<div class="mb-10 text-center">
<div class="w-20 h-20 mx-auto bg-surface-container-highest rounded-full flex items-center justify-center mb-6 shadow-[0px_24px_48px_rgba(26,28,27,0.06)] relative overflow-hidden">
<!-- Decorative subtle gradient bg -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/10 to-primary-container/20"></div>
<span class="material-symbols-outlined text-4xl text-primary relative z-10" style="font-variation-settings: 'FILL' 0;">lock_reset</span>
</div>
<h1 class="font-display font-bold text-[2.5rem] leading-tight tracking-tight text-on-surface mb-3">Reset Password</h1>
<p class="font-body text-base text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
                Enter your email address and we'll send you a link to reset your password.
            </p>
</div>
<!-- Form Section -->
<form action="#" class="space-y-8" method="POST">
<!-- Input Field -->
<div class="space-y-2 relative">
<label class="font-label text-sm font-semibold text-on-surface ml-4 uppercase tracking-widest block" for="email">Email Address</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-[20px] p-2 shadow-[0px_8px_24px_rgba(26,28,27,0.04)] focus-within:ring-2 focus-within:ring-primary-container transition-all duration-200">
<div class="w-12 h-12 flex items-center justify-center bg-surface-container-low rounded-full text-on-surface-variant flex-shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">mail</span>
</div>
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body text-lg px-4 placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-white font-body font-bold text-lg py-5 px-6 rounded-[20px] shadow-[0px_16px_32px_rgba(166,59,0,0.2)] hover:shadow-[0px_24px_48px_rgba(255,94,0,0.3)] active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 group" type="submit">
                Send Reset Link
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-12 text-center">
<a class="inline-flex items-center gap-2 font-body font-bold text-primary hover:text-primary-container transition-colors relative after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-full after:h-[2px] after:bg-primary-container/0 hover:after:bg-primary-container after:transition-colors pb-1" href="#">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0;">login</span>
