<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Oil Watcher - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --primary: #a63b00;
            --primary-container: #ff5e00;
            --on-primary: #ffffff;
            --surface: #f9f9f7;
            --surface-container-lowest: #ffffff;
            --surface-container-low: #f4f4f2;
            --surface-container-high: #e8e8e6;
            --surface-variant: #e2e3e1;
            --on-surface: #1a1c1b;
            --on-surface-variant: #5b4137;
            --outline: #8f7065;
            --outline-variant: #e4bfb1;
            --error: #ba1a1a;
            --error-container: #ffdad6;
            --on-error-container: #93000a;
            --primary-fixed: #ffdbce;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', system-ui, -apple-system, sans-serif;
            background-color: var(--surface);
            color: var(--on-surface);
            min-height: 100dvh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-family: 'Material Symbols Outlined';
        }

        /* ── Top Bar ── */
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            background: rgba(249,249,247,0.85);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            display: flex; align-items: center; justify-content: center;
            height: 56px;
        }
        .top-bar h1 {
            font-weight: 800; letter-spacing: 0.15em;
            color: var(--primary); font-size: 16px;
        }

        /* ── Page Wrapper ── */
        .page {
            padding: 72px 20px 32px;
            min-height: 100dvh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        /* ── Main Content ── */
        .main-content {
            width: 100%; max-width: 400px;
            display: flex; flex-direction: column; gap: 24px;
        }

        /* ── Header ── */
        .header { text-align: center; }
        .header .icon-circle {
            width: 64px; height: 64px; border-radius: 50%;
            background: var(--surface-container-high);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
        }
        .header .icon-circle .material-symbols-outlined {
            font-size: 32px; color: var(--primary);
            font-variation-settings: 'FILL' 1;
        }
        .header h2 {
            font-size: 26px; font-weight: 700; letter-spacing: -0.02em;
            color: var(--on-surface); margin-bottom: 6px;
        }
        .header p {
            font-size: 14px; color: var(--on-surface-variant); line-height: 1.5;
        }

        /* ── Form Card ── */
        .form-card {
            background: var(--surface-container-lowest);
            border-radius: 20px; padding: 20px;
            box-shadow: 0px 16px 32px rgba(26,28,27,0.05);
        }
        .field { margin-bottom: 16px; }
        .field:last-of-type { margin-bottom: 8px; }
        label {
            display: block; font-size: 11px; font-weight: 700;
            color: var(--on-surface); text-transform: uppercase;
            letter-spacing: 0.08em; margin-bottom: 6px;
        }
        .label-row { display: flex; justify-content: space-between; align-items: center; }
        .label-row a {
            font-size: 13px; font-weight: 600; color: var(--primary);
            text-decoration: none;
        }
        .input-wrap { position: relative; }
        .input-wrap .material-symbols-outlined {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--on-surface-variant); font-size: 20px; pointer-events: none;
        }
        .input-wrap input {
            width: 100%; background: var(--surface-container-low);
            border: none; border-radius: 14px; padding: 14px 44px 14px 44px;
            font-family: inherit; font-size: 15px;
            color: var(--on-surface); outline: none;
            transition: box-shadow 0.15s;
        }
        .input-wrap input::placeholder { color: rgba(91,65,55,0.35); }
        .input-wrap input:focus { box-shadow: 0 0 0 2px var(--primary); background: #fff; }
        .toggle-pw {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--on-surface-variant);
            cursor: pointer; padding: 4px;
        }

        /* ── Buttons ── */
        .btn-primary {
            width: 100%; padding: 14px; margin-top: 8px;
            background: linear-gradient(135deg, var(--primary), var(--primary-container));
            color: var(--on-primary); border: none; border-radius: 16px;
            font-family: inherit; font-weight: 700; font-size: 16px;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 8px;
            transition: opacity 0.15s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

        .divider {
            display: flex; align-items: center; gap: 12px; padding: 4px 0;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: var(--surface-container-high);
        }
        .divider span {
            font-size: 10px; font-weight: 700; color: var(--on-surface-variant);
            text-transform: uppercase; letter-spacing: 0.1em;
        }

        .alt-buttons { display: flex; flex-direction: column; gap: 10px; }
        .btn-alt {
            width: 100%; padding: 13px; border-radius: 14px;
            font-family: inherit; font-weight: 600; font-size: 14px;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 10px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-alt-key { background: var(--surface-container-high); color: var(--on-surface); border: none; }
        .btn-alt-social {
            background: var(--surface-container-lowest);
            border: 1px solid rgba(228,191,177,0.25); color: var(--on-surface);
        }

        .footer {
            text-align: center; padding-top: 8px;
            font-size: 14px; color: var(--on-surface-variant);
        }
        .footer a { font-weight: 700; color: var(--primary); text-decoration: none; }

        /* ── Message bar (BELOW button so always visible) ── */
        .msg-bar {
            display: none; padding: 12px 14px; border-radius: 14px;
            font-size: 13px; font-weight: 600;
            animation: slideUp 0.3s ease-out;
            margin-top: 12px; line-height: 1.4;
        }
        .msg-bar.error {
            display: flex; align-items: center; gap: 8px;
            background: var(--error-container); color: var(--on-error-container);
        }
        .msg-bar.success {
            display: flex; align-items: center; gap: 8px;
            background: #d4edda; color: #155724;
        }
        .msg-bar .material-symbols-outlined { font-size: 18px; flex-shrink: 0; }
        @keyframes slideUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

        .spinner {
            display: none; width: 18px; height: 18px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        .spinner.active { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Debug bar ── */
        .debug-bar {
            display:none; padding:8px 10px; margin-top:8px;
            border-radius:8px; background:#333; color:#0f0;
            font-size:11px; font-family:monospace; word-break:break-all;
        }
        .debug-bar.active { display:block; }
    </style>
</head>
<body>
    <header class="top-bar"><h1>OIL WATCHER</h1></header>

    <div class="page">
        <main class="main-content">
            <div class="header">
                <div class="icon-circle">
                    <span class="material-symbols-outlined">local_gas_station</span>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to track fuel prices in your community.</p>
            </div>

            <!-- novalidate: we handle all validation in JS -->
            <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
                <div class="form-card">
                    <div class="field">
                        <label for="email">Email Address</label>
                        <div class="input-wrap">
                            <span class="material-symbols-outlined">mail</span>
                            <input id="email" type="email" placeholder="name@example.com" autocomplete="email"/>
                        </div>
                    </div>
                    <div class="field">
                        <div class="label-row">
                            <label for="password">Password</label>
                            <a href="javascript:void(0)" onclick="goForgotPassword()">Forgot?</a>
                        </div>
                        <div class="input-wrap">
                            <span class="material-symbols-outlined">lock</span>
                            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>
                            <button type="button" class="toggle-pw" onclick="togglePassword()">
                                <span class="material-symbols-outlined" id="pwIcon">visibility_off</span>
                            </button>
                        </div>
                    </div>
                    <button class="btn-primary" type="submit" id="btnLogin">
                        <span id="btnLoginText">Sign In</span>
                        <span class="material-symbols-outlined" id="btnLoginArrow" style="font-size:18px">arrow_forward</span>
                        <span class="spinner" id="btnLoginSpinner"></span>
                    </button>

                    <!-- Message bar BELOW button so always visible -->
                    <div class="msg-bar" id="msgBar"></div>
                    <div class="debug-bar" id="debugBar"></div>
                </div>

                <div style="padding-top:12px;">
                    <div class="divider"><span>Or continue with</span></div>
                    <div class="alt-buttons" style="margin-top:12px;">
                        <button type="button" class="btn-alt btn-alt-key" onclick="loginWithAuthKey()">
                            <span class="material-symbols-outlined" style="font-size:20px">key</span> Login with Auth Key
                        </button>
                        <button type="button" class="btn-alt btn-alt-social" onclick="loginWithGoogle()">
                            <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                            Continue with Google
                        </button>
                        <button type="button" class="btn-alt btn-alt-social" onclick="loginWithFacebook()">
                            <svg width="18" height="18" fill="#1877F2" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                            Continue with Facebook
                        </button>
                    </div>
                </div>

                <div class="footer">
                    <p>Don't have an account? <a href="javascript:void(0)" onclick="goSignUp()">Create an account</a></p>
                </div>
            </form>
        </main>
    </div>

    <script>
        var _loginTimeout = null;
        var _authInProgress = false;

        function log(msg) {
            var d = document.getElementById('debugBar');
            d.textContent = '[DEBUG] ' + msg;
            d.className = 'debug-bar active';
            console.log('[Login] ' + msg);
        }

        function togglePassword() {
            var p = document.getElementById('password'), i = document.getElementById('pwIcon');
            if (p.type === 'password') { p.type = 'text'; i.textContent = 'visibility'; }
            else { p.type = 'password'; i.textContent = 'visibility_off'; }
        }

        function showMsg(type, msg) {
            var b = document.getElementById('msgBar');
            var icon = type === 'success' ? 'check_circle' : 'error';
            b.className = 'msg-bar ' + type;
            b.innerHTML = '<span class="material-symbols-outlined">' + icon + '</span><span>' + msg + '</span>';
            b.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function clearMsg() {
            var b = document.getElementById('msgBar');
            b.className = 'msg-bar';
            b.style.display = 'none';
            b.innerHTML = '';
        }

        function setLoading(loading) {
            var b = document.getElementById('btnLogin');
            var t = document.getElementById('btnLoginText');
            var a = document.getElementById('btnLoginArrow');
            var s = document.getElementById('btnLoginSpinner');
            b.disabled = loading;
            t.textContent = loading ? 'Signing in...' : 'Sign In';
            a.style.display = loading ? 'none' : '';
            s.className = loading ? 'spinner active' : 'spinner';
            _authInProgress = loading;
        }

        function handleLogin(e) {
            e.preventDefault();
            e.stopPropagation();

            var em = document.getElementById('email').value.trim();
            var pw = document.getElementById('password').value;

            log('handleLogin: email="' + em + '", pwLen=' + pw.length);

            // Client-side validation
            if (!em) {
                showMsg('error', 'Please enter your email address.');
                return;
            }
            if (!pw) {
                showMsg('error', 'Please enter your password.');
                return;
            }

            clearMsg();
            setLoading(true);
            log('Validation passed. Calling AndroidBridge.login()...');

            // Safety timeout
            if (_loginTimeout) clearTimeout(_loginTimeout);
            _loginTimeout = setTimeout(function() {
                if (_authInProgress) {
                    setLoading(false);
                    showMsg('error', 'Sign in timed out after 20 seconds. Please check your internet connection.');
                    log('TIMEOUT: No response from native bridge after 20s');
                }
            }, 20000);

            // Call the native bridge
            if (typeof AndroidBridge !== 'undefined' && AndroidBridge !== null) {
                try {
                    log('AndroidBridge exists, calling login...');
                    AndroidBridge.login(em, pw);
                    log('AndroidBridge.login() called successfully (async - waiting for callback)');
                } catch (err) {
                    setLoading(false);
                    if (_loginTimeout) clearTimeout(_loginTimeout);
                    showMsg('error', 'Bridge error: ' + (err.message || err));
                    log('EXCEPTION calling AndroidBridge.login: ' + (err.message || err));
                }
            } else {
                setLoading(false);
                if (_loginTimeout) clearTimeout(_loginTimeout);
                showMsg('error', 'App bridge is not available. Please close and reopen the app.');
                log('ERROR: AndroidBridge is undefined or null');
            }
        }

        // This function is called from Kotlin via evaluateJavascript
        function receiveAuthResult(status, message) {
            log('receiveAuthResult: status=' + status + ', message=' + message);

            if (_loginTimeout) { clearTimeout(_loginTimeout); _loginTimeout = null; }
            setLoading(false);

            if (status === 'success') {
                showMsg('success', message || 'Login successful! Redirecting...');
            } else {
                showMsg('error', message || 'Login failed. Please check your credentials.');
            }
        }

        function goSignUp() {
            if (typeof AndroidBridge !== 'undefined') AndroidBridge.navigate('signup');
        }
        function goForgotPassword() {
            if (typeof AndroidBridge !== 'undefined') AndroidBridge.navigate('forgot_password');
        }
        function loginWithGoogle() {
            if (typeof AndroidBridge !== 'undefined') AndroidBridge.loginWithGoogle();
        }
        function loginWithFacebook() {
            if (typeof AndroidBridge !== 'undefined') AndroidBridge.loginWithFacebook();
        }
        function loginWithAuthKey() {
            if (typeof AndroidBridge !== 'undefined') AndroidBridge.loginWithAuthKey();
        }
    </script>
</body>
</html>
