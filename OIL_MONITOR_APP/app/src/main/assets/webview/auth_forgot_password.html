<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Oil Watcher - Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --primary:#a63b00; --primary-container:#ff5e00; --on-primary:#fff;
            --surface:#f9f9f7; --surface-container-lowest:#fff; --surface-container-low:#f4f4f2;
            --surface-container-high:#e8e8e6; --surface-container-highest:#e2e3e1;
            --on-surface:#1a1c1b; --on-surface-variant:#5b4137; --outline:#8f7065;
            --error:#ba1a1a; --error-container:#ffdad6; --on-error-container:#93000a;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Roboto',system-ui,sans-serif;background:var(--surface);color:var(--on-surface);min-height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
        .material-symbols-outlined{font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}

        .top-nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:56px;background:rgba(249,249,247,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
        .nav-back{width:40px;height:40px;border-radius:50%;background:var(--surface-container-low);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--on-surface)}
        .nav-back:active{transform:scale(0.95)}
        .nav-title{font-weight:700;font-size:17px;letter-spacing:-0.01em}
        .nav-spacer{width:40px}

        .page{padding:72px 20px 32px;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center}
        .main-content{width:100%;max-width:400px}

        .header{text-align:center;margin-bottom:28px}
        .icon-wrap{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;background:var(--surface-container-highest);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
        .icon-wrap::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(166,59,0,0.08),rgba(255,94,0,0.15))}
        .icon-wrap .material-symbols-outlined{font-size:32px;color:var(--primary);position:relative;z-index:1}
        .header h1{font-size:28px;font-weight:700;letter-spacing:-0.02em;margin-bottom:10px}
        .header p{font-size:14px;color:var(--on-surface-variant);line-height:1.6;max-width:280px;margin:0 auto}

        .field-group{margin-bottom:24px}
        .field-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-left:12px;margin-bottom:8px;display:block}
        .input-capsule{display:flex;align-items:center;background:var(--surface-container-lowest);border-radius:18px;padding:6px;transition:box-shadow 0.15s}
        .input-capsule:focus-within{box-shadow:0 0 0 2px var(--primary-container)}
        .input-capsule .icon-box{width:44px;height:44px;flex-shrink:0;background:var(--surface-container-low);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--on-surface-variant)}
        .input-capsule input{flex:1;background:transparent;border:none;font-family:inherit;font-size:15px;color:var(--on-surface);padding:0 14px;outline:none}
        .input-capsule input::placeholder{color:rgba(91,65,55,0.35)}

        .btn-primary{width:100%;padding:16px;background:linear-gradient(135deg,var(--primary),var(--primary-container));color:#fff;border:none;border-radius:18px;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0px 12px 24px rgba(166,59,0,0.15);transition:transform 0.1s}
        .btn-primary:active{transform:scale(0.97)}
        .btn-primary:disabled{opacity:0.55;cursor:not-allowed;transform:none}
        .btn-primary .material-symbols-outlined{transition:transform 0.15s}
        .btn-primary:not(:disabled):active .material-symbols-outlined{transform:translateX(3px)}

        /* ── Message bar (BELOW button) ── */
        .msg-bar{display:none;padding:12px 14px;border-radius:14px;font-size:13px;font-weight:600;margin-top:12px;animation:slideUp 0.3s ease-out;line-height:1.4}
        .msg-bar.error{display:flex;align-items:center;gap:8px;background:var(--error-container);color:var(--on-error-container)}
        .msg-bar.success{display:flex;align-items:center;gap:8px;background:#d4edda;color:#155724}
        .msg-bar .material-symbols-outlined{font-size:18px;flex-shrink:0}
        @keyframes slideUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

        .footer{text-align:center;margin-top:32px}
        .footer a{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--primary);text-decoration:none;font-size:14px}
        .footer a .material-symbols-outlined{font-size:16px}

        .spinner{display:none;width:18px;height:18px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite}
        .spinner.active{display:inline-block}
        @keyframes spin{to{transform:rotate(360deg)}}

        .debug-bar{display:none;padding:8px 10px;margin-top:8px;border-radius:8px;background:#333;color:#0f0;font-size:11px;font-family:monospace;word-break:break-all}
        .debug-bar.active{display:block}
    </style>
</head>
<body>
    <nav class="top-nav">
        <button class="nav-back" onclick="goBack()"><span class="material-symbols-outlined">arrow_back</span></button>
        <span class="nav-title">Security</span>
        <div class="nav-spacer"></div>
    </nav>
    <div class="page">
        <main class="main-content">
            <div class="header">
                <div class="icon-wrap"><span class="material-symbols-outlined">lock_reset</span></div>
                <h1>Reset Password</h1>
                <p>Enter your email address and we'll send you a link to reset your password.</p>
            </div>
            <form id="resetForm" onsubmit="handleReset(event)" novalidate>
                <div class="field-group">
                    <label class="field-label" for="email">Email Address</label>
                    <div class="input-capsule">
                        <div class="icon-box"><span class="material-symbols-outlined">mail</span></div>
                        <input id="email" type="email" placeholder="name@example.com" autocomplete="email"/>
                    </div>
                </div>
                <button class="btn-primary" type="submit" id="btnReset">
                    <span id="btnText">Send Reset Link</span>
                    <span class="material-symbols-outlined" id="btnArrow" style="font-size:18px">arrow_forward</span>
                    <span class="spinner" id="btnSpinner"></span>
                </button>
                <div class="msg-bar" id="msgBar"></div>
                <div class="debug-bar" id="debugBar"></div>
            </form>
            <div class="footer">
                <a href="javascript:void(0)" onclick="goBack()">
                    <span class="material-symbols-outlined">login</span> Back to Login
                </a>
            </div>
        </main>
    </div>
    <script>
        var _resetTimeout = null;
        var _authInProgress = false;

        function log(msg) {
            var d = document.getElementById('debugBar');
            d.textContent = '[DEBUG] ' + msg;
            d.className = 'debug-bar active';
        }

        function showMsg(type, msg) {
            var b = document.getElementById('msgBar');
            var icon = type === 'success' ? 'check_circle' : 'error';
            b.className = 'msg-bar ' + type;
            b.innerHTML = '<span class="material-symbols-outlined">' + icon + '</span><span>' + msg + '</span>';
            b.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function setLoading(loading) {
            var b = document.getElementById('btnReset');
            var t = document.getElementById('btnText');
            var a = document.getElementById('btnArrow');
            var s = document.getElementById('btnSpinner');
            b.disabled = loading;
            t.textContent = loading ? 'Sending...' : 'Send Reset Link';
            a.style.display = loading ? 'none' : '';
            s.className = loading ? 'spinner active' : 'spinner';
            _authInProgress = loading;
        }

        function handleReset(e) {
            e.preventDefault();
            var em = document.getElementById('email').value.trim();

            if (!em) { showMsg('error', 'Please enter your email address.'); return; }

            setLoading(true);
            log('Calling AndroidBridge.resetPassword("' + em + '")...');

            if (_resetTimeout) clearTimeout(_resetTimeout);
            _resetTimeout = setTimeout(function() {
                if (_authInProgress) {
                    setLoading(false);
                    showMsg('error', 'Request timed out. Check your connection.');
                }
            }, 20000);

            if (typeof AndroidBridge !== 'undefined') {
                try {
                    AndroidBridge.resetPassword(em);
                } catch (err) {
                    setLoading(false);
                    showMsg('error', 'Bridge error: ' + err.message);
                }
            } else {
                setLoading(false);
                showMsg('error', 'App bridge not available. Restart the app.');
            }
        }

        function receiveAuthResult(status, message) {
            log('receiveAuthResult: ' + status + ' - ' + message);
            if (_resetTimeout) { clearTimeout(_resetTimeout); _resetTimeout = null; }
            setLoading(false);
            showMsg(status === 'success' ? 'success' : 'error', message || 'Something went wrong.');
        }

        function goBack() {
            if (typeof AndroidBridge !== 'undefined') AndroidBridge.navigate('login');
        }
    </script>
</body>
</html>
