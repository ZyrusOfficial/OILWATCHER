<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Oil Watcher - Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --primary: #a63b00; --primary-container: #ff5e00; --on-primary: #fff;
            --surface: #f9f9f7; --surface-container-lowest: #fff; --surface-container-low: #f4f4f2;
            --surface-container-high: #e8e8e6; --on-surface: #1a1c1b;
            --on-surface-variant: #5b4137; --outline: #8f7065; --outline-variant: #e4bfb1;
            --error: #ba1a1a; --error-container: #ffdad6; --on-error-container: #93000a;
            --primary-fixed: #ffdbce;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Roboto', system-ui, sans-serif;
            background: var(--surface); color: var(--on-surface);
            min-height: 100dvh; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }

        .top-bar {
            position:fixed; top:0; left:0; right:0; z-index:50;
            background:rgba(249,249,247,0.85); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
            display:flex; align-items:center; justify-content:space-between;
            padding:0 16px; height:56px;
        }
        .top-bar-back {
            width:40px; height:40px; border-radius:50%; background:none; border:none;
            cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--primary);
        }
        .top-bar h1 { font-size:16px; font-weight:800; letter-spacing:0.15em; color:var(--on-surface); }
        .top-bar-spacer { width:40px; }

        .page {
            padding: 72px 20px 32px;
            min-height: 100dvh;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
        }
        .main-content { width:100%; max-width:400px; }

        .header { text-align:center; margin-bottom:24px; }
        .header .icon-circle {
            width:56px; height:56px; border-radius:50%; background:var(--primary-fixed);
            display:inline-flex; align-items:center; justify-content:center; margin-bottom:14px;
        }
        .header .icon-circle .material-symbols-outlined { font-size:26px; color:var(--primary); font-variation-settings:'FILL' 1; }
        .header h2 { font-size:26px; font-weight:700; letter-spacing:-0.02em; margin-bottom:4px; }
        .header p { font-size:14px; color:var(--on-surface-variant); }

        .form-section { margin-bottom:20px; }
        .field { margin-bottom:14px; }
        label { display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px; }
        .input-wrap { position:relative; }
        .input-wrap .icon {
            position:absolute; left:14px; top:50%; transform:translateY(-50%);
            color:var(--outline); font-size:20px; pointer-events:none;
        }
        .input-wrap input {
            width:100%; background:var(--surface-container-lowest); border:none; border-radius:16px;
            padding:14px 14px 14px 44px; font-family:inherit; font-size:15px;
            color:var(--on-surface); outline:none; transition:box-shadow 0.15s;
        }
        .input-wrap input::placeholder { color:var(--outline); opacity:0.6; }
        .input-wrap input:focus { box-shadow:0 0 0 2px var(--primary); }
        .field-hint { font-size:11px; color:var(--on-surface-variant); margin-top:4px; padding-left:2px; }

        .btn-primary {
            width:100%; padding:14px;
            background:linear-gradient(135deg,var(--primary),var(--primary-container));
            color:var(--on-primary); border:none; border-radius:16px;
            font-family:inherit; font-weight:700; font-size:16px;
            cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
            box-shadow:0px 8px 20px rgba(255,94,0,0.15); transition:transform 0.1s;
        }
        .btn-primary:active { transform:scale(0.97); }
        .btn-primary:disabled { opacity:0.55; cursor:not-allowed; transform:none; }

        /* ── Error/success message (BELOW the button so it's always visible) ── */
        .msg-bar {
            display:none; padding:12px 14px; border-radius:14px; font-size:13px;
            font-weight:600; margin-top:12px;
            animation:slideUp 0.3s ease-out; line-height:1.4;
        }
        .msg-bar.error {
            display:flex; align-items:center; gap:8px;
            background:var(--error-container); color:var(--on-error-container);
        }
        .msg-bar.success {
            display:flex; align-items:center; gap:8px;
            background:#d4edda; color:#155724;
        }
        .msg-bar .material-symbols-outlined { font-size:18px; flex-shrink:0; }
        @keyframes slideUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

        .divider { display:flex; align-items:center; gap:12px; margin:20px 0 16px; }
        .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--surface-container-high); }
        .divider span { font-size:11px; font-weight:700; color:var(--outline); text-transform:uppercase; letter-spacing:0.1em; }

        .btn-social {
            width:100%; padding:13px; background:var(--surface-container-lowest);
            color:var(--on-surface); border:none; border-radius:16px;
            font-family:inherit; font-weight:600; font-size:14px;
            cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
            margin-bottom:10px;
        }

        .footer { margin-top:28px; text-align:center; font-size:14px; color:var(--on-surface-variant); }
        .footer a { font-weight:700; color:var(--primary); text-decoration:none; }

        .spinner { display:none; width:18px; height:18px; border:2.5px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.6s linear infinite; }
        .spinner.active { display:inline-block; }
        @keyframes spin { to{transform:rotate(360deg)} }


    </style>
</head>
<body>
    <header class="top-bar">
        <button class="top-bar-back" onclick="goBack()"><span class="material-symbols-outlined">arrow_back</span></button>
        <h1>OIL WATCHER</h1>
        <div class="top-bar-spacer"></div>
    </header>

    <div class="page">
        <main class="main-content">
            <div class="header">
                <div class="icon-circle"><span class="material-symbols-outlined">local_gas_station</span></div>
                <h2>Create Account</h2>
                <p>Start tracking fuel prices in your community.</p>
            </div>

            <!-- NOTE: form does NOT use HTML5 required/minlength to avoid browser-level blocks -->
            <form id="signupForm" onsubmit="handleSignUp(event)" novalidate>
                <div class="form-section">
                    <div class="field">
                        <label for="name">Full Name</label>
                        <div class="input-wrap">
                            <span class="material-symbols-outlined icon">person</span>
                            <input id="name" type="text" placeholder="John Doe" autocomplete="name"/>
                        </div>
                    </div>
                    <div class="field">
                        <label for="email">Email Address</label>
                        <div class="input-wrap">
                            <span class="material-symbols-outlined icon">mail</span>
                            <input id="email" type="email" placeholder="john@example.com" autocomplete="email"/>
                        </div>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <span class="material-symbols-outlined icon">lock</span>
                            <input id="password" type="password" placeholder="Min 6 characters" autocomplete="new-password"/>
                        </div>
                        <div class="field-hint">Must be at least 6 characters</div>
                    </div>
                </div>

                <button class="btn-primary" type="submit" id="btnSignup">
                    <span id="btnText">Create Account</span>
                    <span class="spinner" id="btnSpinner"></span>
                </button>

                <!-- Message bar is BELOW the button so user always sees it -->
                <div class="msg-bar" id="msgBar"></div>
            </form>

            <div class="divider"><span>Or</span></div>
            <button class="btn-social" type="button" onclick="signUpWithGoogle()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Continue with Google
            </button>
            <button class="btn-social" type="button" onclick="signUpWithFacebook()">
                <svg width="18" height="18" fill="#1877F2" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                Continue with Facebook
            </button>
            <div class="footer"><p>Already have an account? <a href="javascript:void(0)" onclick="goLogin()">Sign In</a></p></div>
        </main>
    </div>

    <script>
        var _signupTimeout = null;
        var _authInProgress = false;

        function log(msg) {
            console.log('[SignUp] ' + msg);
        }

        function showMsg(type, msg) {
            var b = document.getElementById('msgBar');
            var icon = type === 'success' ? 'check_circle' : 'error';
            b.className = 'msg-bar ' + type;
            b.innerHTML = '<span class="material-symbols-outlined">' + icon + '</span><span>' + msg + '</span>';
            // Scroll message into view
            b.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function clearMsg() {
            var b = document.getElementById('msgBar');
            b.className = 'msg-bar';
            b.style.display = 'none';
            b.innerHTML = '';
        }

        function setLoading(loading) {
            var b = document.getElementById('btnSignup');
            var t = document.getElementById('btnText');
            var s = document.getElementById('btnSpinner');
            b.disabled = loading;
            t.textContent = loading ? 'Creating account...' : 'Create Account';
            s.className = loading ? 'spinner active' : 'spinner';
            _authInProgress = loading;
        }

        function handleSignUp(e) {
            e.preventDefault();
            e.stopPropagation();

            var n = document.getElementById('name').value.trim();
            var em = document.getElementById('email').value.trim();
            var pw = document.getElementById('password').value;

            log('handleSignUp: name="' + n + '", email="' + em + '", pwLen=' + pw.length);

            // Client-side validation
            if (!n) {
                showMsg('error', 'Please enter your name.');
                return;
            }
            if (!em) {
                showMsg('error', 'Please enter your email address.');
                return;
            }
            if (!pw) {
                showMsg('error', 'Please enter a password.');
                return;
            }
            if (pw.length < 6) {
                showMsg('error', 'Password must be at least 6 characters. You entered ' + pw.length + '.');
                return;
            }

            clearMsg();
            setLoading(true);
            log('Validation passed. Calling AndroidBridge.signUp()...');

            // Safety timeout — if the bridge never responds, reset the UI
            if (_signupTimeout) clearTimeout(_signupTimeout);
            _signupTimeout = setTimeout(function() {
                if (_authInProgress) {
                    setLoading(false);
                    showMsg('error', 'Account creation timed out after 20 seconds. Please check your internet connection and try again.');
                    log('TIMEOUT: No response from native bridge after 20s');
                }
            }, 20000);

            // Call the native bridge
            if (typeof AndroidBridge !== 'undefined' && AndroidBridge !== null) {
                try {
                    log('AndroidBridge exists, calling signUp...');
                    AndroidBridge.signUp(n, em, pw);
                    log('AndroidBridge.signUp() called successfully (async - waiting for callback)');
                } catch (err) {
                    setLoading(false);
                    if (_signupTimeout) clearTimeout(_signupTimeout);
                    showMsg('error', 'Bridge error: ' + (err.message || err));
                    log('EXCEPTION calling AndroidBridge.signUp: ' + (err.message || err));
                }
            } else {
                setLoading(false);
                if (_signupTimeout) clearTimeout(_signupTimeout);
                showMsg('error', 'App bridge is not available. Please close and reopen the app.');
                log('ERROR: AndroidBridge is undefined or null');
            }
        }

        // This function is called from Kotlin via evaluateJavascript
        function receiveAuthResult(status, message) {
            log('receiveAuthResult: status=' + status + ', message=' + message);

            // Clear timeout
            if (_signupTimeout) { clearTimeout(_signupTimeout); _signupTimeout = null; }
            setLoading(false);

            if (status === 'success') {
                showMsg('success', message || 'Account created successfully! Redirecting...');
            } else {
                showMsg('error', message || 'Sign up failed. Please try with a different email.');
            }
        }

        function goBack() {
            if (typeof AndroidBridge !== 'undefined') AndroidBridge.navigate('login');
        }
        function goLogin() {
            if (typeof AndroidBridge !== 'undefined') AndroidBridge.navigate('login');
        }
        function signUpWithGoogle() {
            if (typeof AndroidBridge !== 'undefined') AndroidBridge.loginWithGoogle();
        }
        function signUpWithFacebook() {
            if (typeof AndroidBridge !== 'undefined') AndroidBridge.loginWithFacebook();
        }
    </script>
</body>
</html>
