<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>Station Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="js/bridge.js"></script>
    <style>
        :root {
            --primary: #a63b00; --primary-container: #ff5e00; --on-primary: #fff;
            --surface: #f9f9f7; --surface-container-lowest: #fff; --surface-container-low: #f4f4f2;
            --surface-container-high: #e8e8e6; --on-surface: #1a1c1b;
            --on-surface-variant: #5b4137; --outline: #8f7065;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', system-ui, sans-serif;
            background: transparent; /* Leaves backing transparent for BottomSheet feel */
            color: var(--on-surface);
            -webkit-user-select: none; user-select: none;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-family:'Material Symbols Outlined'; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block; line-height: 1;
        }
        .sheet {
            background: var(--surface-container-lowest);
            border-radius: 24px 24px 0 0;
            padding: 0 20px 24px;
            height: 100dvh; display: flex; flex-direction: column;
        }
        .drag-handle { display: flex; justify-content: center; padding: 12px 0 16px; cursor: pointer; }
        .drag-handle div { width: 40px; height: 4px; background: var(--surface-container-high); border-radius: 10px; }
        
        .header { margin-bottom: 20px; }
        .header h2 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.2; }
        .header .distance { color: var(--on-surface-variant); font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 4px; margin-top: 6px; }
        
        .price-primary {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--surface-container-low); padding: 16px 20px; border-radius: 16px; margin-bottom: 12px;
        }
        .price-primary .grade { font-size: 16px; font-weight: 700; }
        .price-primary .octane { color: var(--on-surface-variant); font-size: 13px; font-weight: 500; }
        .price-primary .value { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
        .price-primary .trend {
            width: 24px; height: 24px; border-radius: 50%; background: #dcfce7;
            display: flex; align-items: center; justify-content: center;
        }
        .price-primary .trend .material-symbols-outlined { font-size: 16px; color: #16a34a; font-variation-settings: 'FILL' 1; }
        
        .prices-grid { background: var(--surface-container-lowest); border: 1px solid var(--surface-container-high); border-radius: 16px; overflow: hidden; margin-bottom: 16px;}
        .price-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px; border-bottom: 1px solid var(--surface-container-high);
        }
        .price-row:last-child { border-bottom: none; }
        .price-row .label { font-weight: 600; font-size: 15px; }
        .price-row .value { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
        
        .updated { text-align: center; color: var(--on-surface-variant); font-size: 13px; font-weight: 500; padding: 12px 0; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .updated strong { color: var(--on-surface); font-weight: 700; }
        
        .spacer { flex: 1; }
        
        .nav-btn {
            width: 100%; height: 56px; background: var(--primary-container); color: #fff;
            font-family: inherit; font-size: 16px; font-weight: 700;
            border: none; border-radius: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 8px 24px rgba(255,94,0,0.2);
            transition: transform 0.1s; margin-top: 8px;
        }
        .nav-btn:active { transform: scale(0.98); }
        .nav-btn .material-symbols-outlined { font-variation-settings: 'FILL' 1; font-size:20px; }
    </style>
</head>
<body>
<div class="sheet">
    <div class="drag-handle" onclick="goBack()"><div></div></div>
    <div class="header">
        <h2 id="station-name">Loading...</h2>
        <p class="distance">
            <span class="material-symbols-outlined" style="font-size:16px;">location_on</span>
            <span id="station-distance">—</span>
        </p>
    </div>
    
    <div class="price-primary">
        <div>
            <div class="grade">Regular</div>
            <div class="octane">87 Octane</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
            <div class="value" id="price-regular">—</div>
            <div class="trend"><span class="material-symbols-outlined">trending_down</span></div>
        </div>
    </div>
    
    <div class="prices-grid">
        <div class="price-row">
            <span class="label">Premium</span>
            <span class="value" id="price-premium">—</span>
        </div>
        <div class="price-row">
            <span class="label">Diesel</span>
            <span class="value" id="price-diesel">—</span>
        </div>
    </div>
    
    <div class="updated">
        <span class="material-symbols-outlined" style="font-size:16px;">schedule</span>
        <span>Updated <span id="updated-time">—</span> by <strong id="updated-by">—</strong></span>
    </div>
    
    <div class="spacer"></div>
    
    <button class="nav-btn" id="navigate-btn" onclick="handleNavigate()">
        <span class="material-symbols-outlined">navigation</span>
        Navigate Now
    </button>
</div>
<script>
    var stationData = {};
    function onDataReceived(data) {
        stationData = data;
        document.getElementById('station-name').textContent = data.name || 'Station';
        document.getElementById('station-distance').textContent = (data.distance || '—') + ' mi away';
        document.getElementById('price-regular').textContent = formatPrice(data.regular);
        document.getElementById('price-premium').textContent = formatPrice(data.premium);
        document.getElementById('price-diesel').textContent = formatPrice(data.diesel);
        document.getElementById('updated-time').textContent = data.updatedTime || '—';
        document.getElementById('updated-by').textContent = '@' + (data.updatedBy || 'Unknown');
    }
    function handleNavigate() {
        if (stationData.latitude && stationData.longitude) {
            navigateToMap(stationData.latitude, stationData.longitude, stationData.name);
        }
    }
</script>
</body>
</html>
